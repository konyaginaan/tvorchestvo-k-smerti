<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Творчество к смерти — бумажный театр</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314100E'/%3E%3Cpath d='M26 14h12v8l6 8v20a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V30l6-8z' fill='%23E3A781'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #14100E; --text: #F2EADC; --soft: #CFC2AE; --accent: #E3A781; --paper: #F1E8D7; --ink: #2A211C; --rust: #9A4528; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0908; }
body { color: var(--text); font-family: 'Lora', Georgia, serif; -webkit-font-smoothing: antialiased; cursor: none; user-select: none; }
body.pointer { cursor: default; }

#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
.slide { position: absolute; inset: 0; overflow: hidden; visibility: hidden; transform-origin: 50% 58%; }
.slide.current { visibility: visible; z-index: 2; }
/* вперёд: старая сцена надвигается на камеру и уходит под неё, новая проступает из глубины */
.slide.leave-fwd { visibility: visible; z-index: 3; pointer-events: none; animation: pass-under 1.6s cubic-bezier(.4,0,.7,.7) forwards; }
.slide.enter-fwd { animation: from-depth 1.6s cubic-bezier(.3,.5,.35,1) both; }
/* назад — то же самое в обратную сторону */
.slide.leave-back { visibility: visible; z-index: 1; pointer-events: none; animation: from-depth 1.6s cubic-bezier(.65,0,.7,.5) reverse forwards; }
.slide.enter-back { z-index: 3; animation: pass-under 1.6s cubic-bezier(.3,.3,.6,1) reverse both; }
@keyframes pass-under { 0% { transform: none; opacity: 1; filter: none; } 25% { opacity: 1; } 80% { opacity: 0; } 100% { transform: translateY(16%) scale(2.6); opacity: 0; filter: blur(8px); } }
@keyframes from-depth { 0% { transform: scale(.7); opacity: 0; filter: brightness(.45); } 20% { opacity: 1; } 100% { transform: none; opacity: 1; filter: none; } }

/* бумажная сцена: слои на разной глубине */
.pt { position: absolute; inset: 0; overflow: hidden; }
.pt-stage { position: absolute; perspective: 1800px; perspective-origin: 50% 35%; }
.pl { position: absolute; transform-origin: 50% 100%; will-change: scale, translate; }
.pl.back { inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 55%; }
.pl.fig { height: auto; opacity: 0; transform-origin: 50% 100%;
  filter: drop-shadow(14px 16px 12px rgba(0,0,0,.55));
  transition: opacity 1s ease-out, transform 3.6s cubic-bezier(.25,.8,.35,1); transition-delay: var(--in, .8s); }
.pl.fig.in-up { transform: rotateX(86deg); }                       /* лежит на сгибе и встаёт, как в открытке */
.pl.fig.in-left { transform: translateX(-1500px) rotate(-4deg); }  /* выезжает слева */
.pl.fig.in-right { transform: translateX(1500px) rotate(4deg); }
.pl.fig.in-up { transition: opacity .6s ease-out, transform 2.4s cubic-bezier(.3,1.35,.5,1); transition-delay: var(--in, .8s); }
.pl.fig.in-walk { transition: opacity .3s ease-out; transition-delay: var(--in, 1s); animation-play-state: paused; }
.on .pl.fig.in-walk { opacity: 1; animation-play-state: running; }
.on .pl.fig { opacity: 1; transform: none; }
.pl.fig.sway { animation: sway 7s ease-in-out infinite; animation-delay: var(--sd, 0s); }
@keyframes sway { 0%, 100% { rotate: -1deg; } 50% { rotate: 1deg; } }
.pl.fig.cut { filter: drop-shadow(3px 0 0 #F6EFE2) drop-shadow(-3px 0 0 #F6EFE2) drop-shadow(0 3px 0 #F6EFE2) drop-shadow(0 -3px 0 #F6EFE2) drop-shadow(14px 16px 12px rgba(0,0,0,.55)); }

/* текст */
.cap { position: absolute; z-index: 6; left: 160px; right: 160px; bottom: 120px; }
.cap.top { bottom: auto; top: 110px; }
.cap.center { text-align: center; }
.cap.right { left: auto; width: 58%; text-align: right; }
.cap.left { right: auto; width: 52%; }
.cap::before { content: ''; position: absolute; inset: -180px -260px; z-index: -1; background: radial-gradient(ellipse closest-side at center, rgba(14,11,9,.42) 0%, rgba(14,11,9,.28) 45%, rgba(14,11,9,.1) 75%, rgba(14,11,9,0) 100%); filter: blur(30px); }
h1, .quote, .punch, .big, .year { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; margin: 0; }
h1 { font-size: 140px; line-height: 1.02; }
.sub { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 52px; color: #E8DDC9; margin: 16px 0 0; }
.author { font-size: 24px; letter-spacing: 5px; text-transform: uppercase; color: #EFE6D6; margin: 30px 0 0; }
.eyebrow { font-family: 'Caveat', cursive; font-size: 46px; color: var(--accent); margin: 0 0 8px; }
.quote { font-style: italic; font-size: 74px; line-height: 1.14; }
.punch { font-style: italic; font-size: 48px; line-height: 1.25; color: var(--accent); margin: 20px 0 0; }
.cite { font-size: 22px; color: var(--soft); margin: 12px 0 0; }
.big { font-size: 100px; line-height: 1.15; }
.year { font-size: 140px; line-height: 1; }
.cap p, .cap h1 { text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 2px 22px rgba(0,0,0,.9); }
.r { opacity: 0; transform: translateY(24px); filter: blur(6px); transition: opacity 1.1s ease-out, transform 1.1s ease-out, filter 1.1s ease-out; transition-delay: var(--d, 1s); }
.on .r { opacity: 1; transform: none; filter: none; }
.on .r.step { opacity: 0; transform: translateY(24px); filter: blur(6px); transition-delay: 0s; }
.on .r.step.shown { opacity: 1; transform: none; filter: none; }

/* этикетки */
.labels { display: flex; gap: 26px; margin-top: 30px; }
.label { position: relative; flex: 1 1 0; background: #EDE3CF; color: var(--ink); border: 1px solid #CDB894; padding: 22px 28px; box-shadow: 0 12px 34px rgba(0,0,0,.5); text-align: left; }
.label::before { content: ''; position: absolute; inset: 7px; border: 1px dashed rgba(154,69,40,.35); }
.label b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 42px; font-weight: 600; margin-bottom: 4px; }
.label span { font-size: 25px; line-height: 1.4; color: #4B3F37; text-shadow: none; }
.label small { display: block; margin-top: 8px; font-size: 19px; color: #6B5C51; }

.end { background: radial-gradient(ellipse at 50% 40%, #241C17 0%, #0B0908 72%); display: flex; align-items: center; justify-content: center; text-align: center; }
.qr { display: inline-block; background: var(--paper); padding: 18px; margin-top: 30px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.qr svg { display: block; width: 240px; height: 240px; }
.url { font-size: 28px; color: var(--soft); margin: 20px 0 0; }
.btn { display: inline-block; margin: 34px 10px 0; font-family: 'Caveat', cursive; font-size: 32px; color: var(--accent); background: rgba(14,11,9,.5); border: 1px solid rgba(227,167,129,.35); border-radius: 50px; padding: 6px 30px; cursor: pointer; text-decoration: none; }

#bar { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; transition: width .6s ease; z-index: 20; opacity: .7; }
#hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 20; font-size: 14px; color: var(--soft); background: rgba(14,11,9,.7); border: 1px solid rgba(227,167,129,.35); border-radius: 40px; padding: 8px 20px; transition: opacity 1s; white-space: nowrap; }
#hint.hide { opacity: 0; }
#home { position: fixed; top: 14px; left: 18px; z-index: 20; font: 15px 'Lora', Georgia, serif; letter-spacing: 1px; color: var(--soft); background: rgba(14,11,9,.55); border: 1px solid rgba(227,167,129,.35); border-radius: 40px; padding: 6px 16px; cursor: pointer; opacity: 0; transition: opacity .6s; }
#home:hover { color: var(--accent); }
body.pointer #home { opacity: .9; }
.pl.layer { height: auto; pointer-events: none; transform-origin: 50% 100%; filter: drop-shadow(0 -6px 14px rgba(0,0,0,.4)); }
.pl.fog { left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; mix-blend-mode: screen; }
.pl.fog i { position: absolute; width: 34%; aspect-ratio: 1.6; margin: -10% 0 0 -17%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(214,206,232,.75), rgba(170,160,200,.35) 55%, transparent);
  filter: blur(18px); opacity: 0; transform: scale(.3); }
.on .pl.fog i { animation: dreamfog 9s ease-in-out forwards, fogdrift 7s ease-in-out infinite alternate; animation-delay: calc(.4s + var(--k) * .25s), calc(var(--k) * -1.3s); }
@keyframes dreamfog { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: .95; transform: scale(1.5); } 42% { opacity: 1; transform: scale(1.8); } 60% { opacity: .15; transform: scale(2.4); } 100% { opacity: .1; transform: scale(2.6); } }
@keyframes fogdrift { from { translate: -3% 2%; } to { translate: 3% -3%; } }
.pl.layer, .pl.front { z-index: 2; }
.pl.front.bare { filter: none !important; }
.pl.front.plain { filter: drop-shadow(0 0 1.5px rgba(241,232,215,.7)) drop-shadow(-8px 6px 14px rgba(0,0,0,.4)); }
.pl.front { left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; transform-origin: 50% 100%;
  filter: drop-shadow(0 -2px 0 rgba(241,232,215,.85)) drop-shadow(0 -10px 14px rgba(0,0,0,.45)); }
.pl.front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pl.smell { left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; opacity: 0; transition: opacity 1.5s ease 2.6s; }
.on .pl.smell { opacity: 1; }
.smell path { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 45 55; animation: waft 6.5s linear infinite; animation-delay: calc(var(--k) * -1.8s); }
.smell .edge { stroke: rgba(241,232,215,.8); stroke-width: 11; }
.smell .rib { stroke-width: 7; }
@keyframes waft { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
.ghosts span { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 96px; line-height: 1.05; color: rgba(242,234,220,.5); filter: blur(.6px); }
.ghosts span:nth-child(2) { margin-left: 90px; opacity: .8; } .ghosts span:nth-child(3) { margin-left: 30px; opacity: .6; }
.chips { display: flex; gap: 14px; margin-top: 18px; } .chip { font-family: 'Caveat', cursive; font-size: 34px; color: var(--ink); background: #EDE3CF; padding: 2px 22px; transform: rotate(-2deg); box-shadow: 0 8px 20px rgba(0,0,0,.45); } .chip:nth-child(2) { transform: rotate(1.5deg); }
.cap.center .labels { justify-content: center; } .cap .labels .label { max-width: 520px; }
.pl.back.dim { filter: brightness(.35) blur(6px); }
@media (prefers-reduced-motion: reduce) { .slide, .r, .pl { transition: none !important; animation: none !important; } }

/* режим правки */
#ed-open { position: fixed; top: 14px; right: 18px; z-index: 20; font: 15px 'Lora', Georgia, serif; color: var(--soft); background: rgba(14,11,9,.55); border: 1px solid rgba(227,167,129,.35); border-radius: 40px; padding: 6px 16px; cursor: pointer; opacity: 0; transition: opacity .6s; }
body.pointer.can-edit #ed-open { opacity: .9; }
body:not(.can-edit) #ed-open { display: none; }
#ed-state { font-weight: 400; color: var(--rust); min-width: 150px; }
#edbar { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 30; display: none; gap: 10px; align-items: center; font: 14px 'Lora', Georgia, serif; color: var(--ink); background: #EDE3CF; border-radius: 12px; padding: 8px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); white-space: nowrap; }
#edbar button { font: inherit; background: #fff; border: 1px solid #CDB894; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
#edbar #ed-done { background: var(--rust); color: #fff; border-color: var(--rust); }
body.editing { cursor: default; }
body.editing #edbar { display: flex; }
body.editing #ed-open, body.editing #home, body.editing #hint { display: none; }
body.editing .r, body.editing .on .r.step { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
body.editing .cap { outline: 1px dashed rgba(241,232,215,.55); outline-offset: 10px; }
body.editing [data-ek] { cursor: text; }
body.editing [data-ek]:focus { outline: 2px solid var(--accent); outline-offset: 4px; }
.ed-grip { display: none; position: absolute; left: -54px; top: -6px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--ink); font-size: 24px; line-height: 40px; text-align: center; cursor: grab; z-index: 2; box-shadow: 0 4px 12px rgba(0,0,0,.5); user-select: none; }
body.editing .ed-grip { display: block; }
</style>
</head>
<body>
<script>
// личная ссылка …/paper.html#k=КЛЮЧ включает правку на этом устройстве; ключ запоминается, из адреса убирается
try { const m = location.hash.match(/k=([\w-]+)/); if (m) { localStorage.setItem('paper-key', m[1]); history.replaceState(null, '', location.pathname); } } catch (e) {}
</script>
<div id="stage"></div>
<div id="bar"></div>
<button id="home" title="К первому слайду (0)">↺ в начало</button>
<div id="edbar"><span>Щёлкните по тексту и правьте · Enter — сохранить · тяните за ✥ · ← → листать</span>
<b id="ed-state"></b><button id="ed-reset">Сбросить этот слайд</button><button id="ed-done">Готово</button></div>
<button id="ed-open" title="Режим правки (E)">✎ править</button>
<div id="hint">→ или пробел — дальше · ← — назад · F — во весь экран · 0 — в начало</div>

<script>
// Сцены бумажного театра. Слои: back — задник; fig — вырезки (left/top/width — в % от задника, d — глубина 0…1).

const lab = (b, t, small) => '<div class="label"><b>' + b + '</b><span>' + t + '</span>' + (small ? '<small>' + small + '</small>' : '') + '</div>';
const SCENES = [
  { label: 'Обложка', back: P + '01-back.webp', alt: 'Ночной Париж из бумажных слоёв, на холме стоит спиной юноша',

  { label: '1738', back: P + '02-back.webp', alt: 'Рыбный рынок в жаркий день, торговка с ножом',

    fronts: [{ src: P + '02-front.webp', left: -1, top: 67, width: 102, d: .85 }],
    html: '<div class="cap top right"><p class="year r">1738</p><p class="punch r" style="--d:1.3s">Против любви, но за жизнь</p></div>' },
  { label: '1767', back: P + '03-back.webp', alt: 'Ночное кладбище, бродяги тянутся к костру',

  { label: 'I. Чем живо живое', back: P + '05b-back.webp', alt: 'Лавка парфюмера: Гренуй переливает духи, Бальдини поражён',

      '<div class="cap center" style="left:300px; right:300px"><div class="labels r step">' + lab('Повторение', 'старая пьеса, которую играем, не помня текста') + lab('Другой принимает', 'и не играет по старым нотам') + lab('Игра', 'терапия там, где встречаются две игры') + lab('Творчество', 'призраки становятся предками') + '</div></div>' },
  { label: 'I. Буржуа', back: P + '06d-back.webp', alt: 'Паучиха «Маман» Луизы Буржуа на набережной, справа портрет Буржуа в бумажной короне',
    figs: [{ src: P + '06e-fig.webp', left: 67, top: 35, width: 29, d: .3, enter: 'right', at: 1.2 }],

  { label: 'II. Ребёнок, который не пахнет', back: P + '07-back.webp', alt: 'Монастырские ворота: кормилица отдаёт младенца, монах принюхивается',
    figs: [{ src: P + '07-fig-nurse.webp', left: 9, top: 41, width: 20, d: .65, enter: 'left', at: 1.0 },
           { src: P + '07-fig-monk.webp', left: 29, top: 42, width: 20, d: .6, enter: 'right', at: 1.0 }],
    html: '<div class="cap right" style="width:44%"><p class="quote r">«Когда я смотрю, меня видят, значит, я существую»</p><p class="cite r" style="--d:1.3s">Винникотт</p><p class="punch r step">Гренуй не пахнет. Первое узнавание не состоялось.</p></div>' },
  { label: 'II. Использовали', back: P + '05-back.webp', dim: true,
    figs: [{ src: P + '08-fig-gaillard.webp', left: 10.6, top: 17, width: 16.2, d: .6, at: .9 }, { src: P + '08-fig-grimal.webp', left: 30.3, top: 17, width: 18.7, d: .6, at: 1.2 },
           { src: P + '05-fig-baldini.webp', left: 51.1, top: 17, width: 18.6, d: .6, at: 1.5 }, { src: P + '08-fig-marquis.webp', left: 72.3, top: 17, width: 17.9, d: .6, at: 1.8 }],
    html: '<div class="cap center" style="bottom:140px"><div class="labels r" style="--d:2.4s">' + lab('Мадам Гайяр', 'деньги') + lab('Грималь', 'рабочие руки') + lab('Бальдини', 'рецепты') + lab('Маркиз', 'доказательство теории') + '</div></div>' +
      '<div class="cap top center" style="top:60px"><p class="punch r step">Его использовали, но не любили.</p></div>' },
  { label: 'II. Целым', back: P + '09b-back.webp', alt: 'Дворик в вечер фейерверка: девушка чистит сливы, сзади подкрадывается Гренуй',

}
const edState = t => { const el = document.getElementById('ed-state'); if (el) el.textContent = t; };
// черновик лежит в браузере, пока сервер не подтвердил сохранение
function saveLocal() {
  try { localStorage.setItem(ED_KEY, JSON.stringify(edits)); } catch (e) {}
  edState('сохраняю…'); clearTimeout(saveT); saveT = setTimeout(pushEdits, 800);
}
async function pushEdits() {
  clearTimeout(saveT);
  try {
    const r = await fetch(API + 'edits', { method: 'PUT', headers: { Authorization: 'Bearer ' + editKey, 'Content-Type': 'application/json' }, body: JSON.stringify(edits) });
    if (!r.ok) throw new Error(r.status);
    try { localStorage.removeItem(ED_KEY); } catch (e) {}
    edState('✓ сохранено на сайте');
  } catch (e) { edState(String(e.message) === '401' ? '⚠ ключ не подходит' : '⚠ нет связи — правки ждут в браузере'); }
}
async function loadEdits() {
  try { const r = await fetch(API + 'edits'); if (r.ok) edits = (await r.json()).edits || {}; } catch (e) {}
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(ED_KEY) || 'null'); } catch (e) {}
  if (draft && editKey) { edits = draft; pushEdits(); }
  applyEdits();
}
loadEdits();
function toggleEdit(on) {
  if (!editKey) return;
  on = on ?? !document.body.classList.contains('editing');
  if (!on) pushEdits();
  document.body.classList.toggle('editing', on);
  document.querySelectorAll('[data-ek]').forEach(el => el.contentEditable = on ? 'true' : 'false');
  if (!on && document.activeElement) document.activeElement.blur();
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-ek]'); if (!el) return;
  const i = slides.indexOf(el.closest('.slide'));
  ((edits[i] ||= {}).t ||= {})[el.dataset.ek] = el.innerHTML; saveLocal();
});
// Enter — сохранить и закончить правку этого текста; Shift+Enter — новая строка
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.closest && e.target.closest('[data-ek]')) { e.preventDefault(); e.target.blur(); pushEdits(); }
  if (e.key === 'Escape' && document.body.classList.contains('editing')) toggleEdit(false);
}, true);
document.addEventListener('paste', e => {   // вставлять только текст, без чужого оформления
  if (!e.target.closest('[data-ek]')) return;
  e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
});
// перетаскивание подписи за ✥ (в координатах сцены 1920×1080)
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.ed-grip'); if (!g) return;
  e.preventDefault();
  const cap = g.parentElement, s = cap.closest('.slide'), i = slides.indexOf(s), n = capsOf(s).indexOf(cap);
  const k = stage.getBoundingClientRect().width / 1920;
  const cur = ((edits[i] || {}).m || {})[n] || [0, 0];
  const x0 = e.clientX, y0 = e.clientY;
  g.style.cursor = 'grabbing';
  const move = ev => {
    const m = [Math.round(cur[0] + (ev.clientX - x0) / k), Math.round(cur[1] + (ev.clientY - y0) / k)];
    ((edits[i] ||= {}).m ||= {})[n] = m; cap.style.translate = m[0] + 'px ' + m[1] + 'px';
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); g.style.cursor = ''; saveLocal(); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});
document.getElementById('ed-open').onclick = e => { e.stopPropagation(); toggleEdit(true); };
document.getElementById('ed-done').onclick = e => { e.stopPropagation(); toggleEdit(false); };
document.getElementById('ed-reset').onclick = e => {
  e.stopPropagation();
  if (!confirm('Вернуть исходные тексты и положение на этом слайде?')) return;
  delete edits[cur]; try { localStorage.setItem(ED_KEY, JSON.stringify(edits)); } catch (e) {}
  pushEdits().then(() => location.reload());
};

</script>
<script src="typo.js"></script>
