<html lang="ru">
<head>
<meta charset="utf-8">

<title>Творчество к смерти — бумажный театр</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314100E'/%3E%3Cpath d='M26 14h12v8l6 8v20a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V30l6-8z' fill='%23E3A781'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #14100E; --text: #F2EADC; --soft: #CFC2AE; --accent: #E3A781; --paper: #F1E8D7; --ink: #2A211C; --rust: #9A4528; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0908; }
body { color: var(--text); font-family: 'Lora', Georgia, serif; -webkit-font-smoothing: antialiased; cursor: none; user-select: none; }
body.pointer { cursor: default; }

#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
.slide { position: absolute; inset: 0; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity 1.1s ease, visibility 0s linear 1.1s; }
.slide.current { opacity: 1; visibility: visible; transition: opacity 1.1s ease, visibility 0s; z-index: 2; }

/* бумажная сцена: слои на разной глубине */
.pt { position: absolute; inset: 0; overflow: hidden; }
.pt-stage { position: absolute; }
.pl { position: absolute; transform-origin: 50% 100%; will-change: scale, translate; }
.pl.back { inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 55%; }
.pl.fig { height: auto; opacity: 0; transform: translateY(60px) rotateX(70deg); transform-origin: 50% 100%;
  filter: drop-shadow(14px 16px 12px rgba(0,0,0,.55));
  transition: opacity .9s ease-out, transform 1.3s cubic-bezier(.2,.9,.25,1.15); transition-delay: var(--in, .4s); }
.on .pl.fig { opacity: 1; transform: none; }
.pl.fig.sway { animation: sway 7s ease-in-out infinite; animation-delay: var(--sd, 0s); }
@keyframes sway { 0%, 100% { rotate: -1deg; } 50% { rotate: 1deg; } }
.pl.fig.cut { filter: drop-shadow(1.8px 0 0 var(--paper)) drop-shadow(-1.8px 0 0 var(--paper)) drop-shadow(0 1.8px 0 var(--paper)) drop-shadow(0 -1.8px 0 var(--paper)) drop-shadow(14px 16px 12px rgba(0,0,0,.55)); }
.curtain { position: absolute; top: 0; bottom: 0; width: 7%; z-index: 4; pointer-events: none; background: linear-gradient(to right, #3b1209, #6e2414 40%, #4a170b 70%, #2a0c06); box-shadow: 0 0 40px rgba(0,0,0,.6); }
.curtain.l { left: 0; border-right: 2px solid rgba(0,0,0,.4); }
.curtain.r { right: 0; transform: scaleX(-1); }
.valance { position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 5; pointer-events: none; background: radial-gradient(ellipse 60px 40px at 60px 0, transparent 70%, #5a1c0f 71%) repeat-x; background-size: 120px 64px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
.boards { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; z-index: 5; background: linear-gradient(#3a2618, #22160e); box-shadow: 0 -4px 14px rgba(0,0,0,.5); }

/* текст */
.cap { position: absolute; z-index: 6; left: 160px; right: 160px; bottom: 120px; }
.cap.top { bottom: auto; top: 110px; }
.cap.center { text-align: center; }
.cap.right { left: auto; width: 58%; text-align: right; }
.cap.left { right: auto; width: 52%; }
.cap::before { content: ''; position: absolute; inset: -60px -120px; z-index: -1; background: radial-gradient(ellipse at center, rgba(14,11,9,.78) 0%, rgba(14,11,9,.5) 45%, rgba(14,11,9,0) 72%); }
h1, .quote, .punch, .big, .year { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; margin: 0; }
h1 { font-size: 140px; line-height: 1.02; }
.sub { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 52px; color: #E8DDC9; margin: 16px 0 0; }
.author { font-size: 24px; letter-spacing: 5px; text-transform: uppercase; color: #EFE6D6; margin: 30px 0 0; }
.eyebrow { font-family: 'Caveat', cursive; font-size: 46px; color: var(--accent); margin: 0 0 8px; }
.quote { font-style: italic; font-size: 74px; line-height: 1.14; }
.punch { font-style: italic; font-size: 48px; line-height: 1.25; color: var(--accent); margin: 20px 0 0; }
.cite { font-size: 22px; color: var(--soft); margin: 12px 0 0; }
.big { font-size: 100px; line-height: 1.15; }
.year { font-size: 140px; line-height: 1; }
.cap p, .cap h1 { text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 2px 22px rgba(0,0,0,.9); }
.r { opacity: 0; transform: translateY(24px); filter: blur(6px); transition: opacity 1.1s ease-out, transform 1.1s ease-out, filter 1.1s ease-out; transition-delay: var(--d, 1s); }
.on .r { opacity: 1; transform: none; filter: none; }
.on .r.step { opacity: 0; transform: translateY(24px); filter: blur(6px); transition-delay: 0s; }
.on .r.step.shown { opacity: 1; transform: none; filter: none; }

/* этикетки */
.labels { display: flex; gap: 26px; margin-top: 30px; }
.label { position: relative; flex: 1 1 0; background: #EDE3CF; color: var(--ink); border: 1px solid #CDB894; padding: 22px 28px; box-shadow: 0 12px 34px rgba(0,0,0,.5); text-align: left; }
.label::before { content: ''; position: absolute; inset: 7px; border: 1px dashed rgba(154,69,40,.35); }
.label b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 42px; font-weight: 600; margin-bottom: 4px; }
.label span { font-size: 25px; line-height: 1.4; color: #4B3F37; text-shadow: none; }
.label small { display: block; margin-top: 8px; font-size: 19px; color: #6B5C51; }

.end { background: radial-gradient(ellipse at 50% 40%, #241C17 0%, #0B0908 72%); display: flex; align-items: center; justify-content: center; text-align: center; }
.qr { display: inline-block; background: var(--paper); padding: 18px; margin-top: 30px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.qr svg { display: block; width: 240px; height: 240px; }
.url { font-size: 28px; color: var(--soft); margin: 20px 0 0; }
.btn { display: inline-block; margin: 34px 10px 0; font-family: 'Caveat', cursive; font-size: 32px; color: var(--accent); background: rgba(14,11,9,.5); border: 1px solid rgba(227,167,129,.35); border-radius: 50px; padding: 6px 30px; cursor: pointer; text-decoration: none; }

#bar { position: fixed; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0; transition: width .6s ease; z-index: 20; opacity: .7; }
#hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 20; font-size: 14px; color: var(--soft); background: rgba(14,11,9,.7); border: 1px solid rgba(227,167,129,.35); border-radius: 40px; padding: 8px 20px; transition: opacity 1s; white-space: nowrap; }
#hint.hide { opacity: 0; }
#exit { position: fixed; top: 14px; left: 18px; z-index: 20; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: 0; transition: opacity .6s; }
#exit a { color: var(--soft); text-decoration: none; margin-right: 18px; }
body.pointer #exit { opacity: .85; }
.ghosts span { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 96px; line-height: 1.05; color: rgba(242,234,220,.5); filter: blur(.6px); }
.ghosts span:nth-child(2) { margin-left: 90px; opacity: .8; } .ghosts span:nth-child(3) { margin-left: 30px; opacity: .6; }
.chips { display: flex; gap: 14px; margin-top: 18px; } .chip { font-family: 'Caveat', cursive; font-size: 34px; color: var(--ink); background: #EDE3CF; padding: 2px 22px; transform: rotate(-2deg); box-shadow: 0 8px 20px rgba(0,0,0,.45); } .chip:nth-child(2) { transform: rotate(1.5deg); }
.cap.center .labels { justify-content: center; } .cap .labels .label { max-width: 520px; }
.pl.back.dim { filter: brightness(.35) blur(6px); }
@media (prefers-reduced-motion: reduce) { .slide, .r, .pl { transition: none !important; animation: none !important; } }
</style>
</head>

<script>
// Сцены бумажного театра. Слои: back — задник; fig — вырезки (left/top/width — в % от задника, d — глубина 0…1).
const P = 'img/paper/';
const lab = (b, t, small) => '<div class="label"><b>' + b + '</b><span>' + t + '</span>' + (small ? '<small>' + small + '</small>' : '') + '</div>';
const SCENES = [
  { label: 'Обложка', back: P + '01-back.webp', alt: 'Ночной Париж из бумажных слоёв, на холме стоит спиной юноша',
    figs: [{ src: P + '01-fig.webp', left: 15, top: 40, width: 9.5, d: .7 }],
    html: '<div class="cap right"><p class="eyebrow r" style="--d:.6s">доклад по роману Патрика Зюскинда «Парфюмер»</p><h1 class="r" style="--d:.9s">Творчество к смерти</h1><p class="sub r" style="--d:1.2s">Жан-Батист Гренуй и мир частичных объектов</p><p class="author r" style="--d:1.5s">Конягина Анастасия · декабрь 2026</p></div>' },
  { label: '1738', back: P + '02-back.webp', alt: 'Рыбный рынок в жаркий день, торговка с ножом',
    figs: [{ src: P + '02-fig.webp', left: 5, top: 42, width: 15, d: .7 }],
    html: '<div class="cap right"><p class="year r">1738</p><p class="punch r" style="--d:1.3s">Против любви, но за жизнь</p></div>' },
  { label: '1767', back: P + '03-back.webp', alt: 'Ночное кладбище, бродяги тянутся к костру',
    figs: [{ src: P + '03-fig.webp', left: 3, top: 52, width: 44, d: .8 }],
    html: '<div class="cap top right"><div class="r step"><p class="year">1767</p><p class="punch">За любовь, но против жизни</p></div></div>' },
  { label: 'Вопрос', back: P + '04-back.webp', alt: 'Тёмная комната, свеча и светящийся флакон',
    figs: [{ src: P + '04-fig.webp', left: 20, top: 38, width: 10, d: .6 }],
    html: '<div class="cap top right"><p class="quote r">Можно ли назвать творчеством то, что от первого до последнего шага идёт к смерти?</p></div>' },
  { label: 'I. Чем живо живое', back: P + '05-back.webp', alt: 'Лавка парфюмера: Гренуй переливает духи, Бальдини поражён',
    figs: [{ src: P + '05-fig-g.webp', left: 2, top: 40, width: 20, d: .7 }, { src: P + '05-fig-baldini.webp', left: 78, top: 38, width: 20, d: .7 }],
    html: '<div class="cap top center" style="left:440px; right:440px"><p class="quote r">Повторение становится творчеством, когда его кто-то принимает</p></div>' +
      '<div class="cap center" style="left:300px; right:300px"><div class="labels r step">' + lab('Повторение', 'старая пьеса, которую играем, не помня текста') + lab('Другой принимает', 'и не играет по старым нотам') + lab('Игра', 'терапия там, где встречаются две игры') + lab('Творчество', 'призраки становятся предками') + '</div></div>' },
  { label: 'I. Буржуа', back: P + '06-back.webp', alt: 'Мастерская скульптора, огромный паук бережёт кокон',
    html: '<div class="cap center"><p class="quote r">«Искусство — гарантия душевного здоровья»</p><p class="punch r" style="--d:1.3s">— Луиза Буржуа</p><p class="punch r step" style="color:#E8DDC9">Живое произведение — это обращение.</p></div>' },
  { label: 'II. Ребёнок, который не пахнет', back: P + '07-back.webp', alt: 'Монастырские ворота: кормилица отдаёт младенца, монах принюхивается',
    figs: [{ src: P + '07-fig.webp', left: 3, top: 46, width: 42, d: .7 }],
    html: '<div class="cap right"><p class="quote r">«Когда я смотрю, меня видят, значит, я существую»</p><p class="cite r" style="--d:1.3s">Винникотт</p><p class="punch r step">Гренуй не пахнет. Первое узнавание не состоялось.</p></div>' },
  { label: 'II. Использовали', back: P + '05-back.webp', dim: true,
    html: '<div class="cap center" style="bottom:auto; top:300px"><div class="labels r">' + lab('Мадам Гайяр', 'деньги') + lab('Грималь', 'рабочие руки') + lab('Бальдини', 'рецепты') + lab('Маркиз', 'доказательство теории') + '</div><p class="punch r step" style="margin-top:70px">Его использовали, но не любили.</p></div>' },
  { label: 'II. Целым', back: P + '09-back.webp', alt: 'Дворик в вечер фейерверка: девушка чистит сливы, сзади подкрадывается Гренуй',
    figs: [{ src: P + '09-fig-g.webp', left: 37, top: 44, width: 20, d: .55 }, { src: P + '09-fig-girl.webp', left: 59, top: 40, width: 21, d: .75 }],
    html: '<div class="cap left top" style="width:44%"><p class="quote r" style="--d:1.4s">Гренуя никто не видел целым — и он не видит целым никого.</p></div>' },
  { label: 'II. Частичные объекты', back: P + '09-back.webp', dim: true,
    html: '<div class="cap center" style="bottom:auto; top:220px"><p class="eyebrow r">мир частичных объектов</p><p class="quote r" style="--d:1.2s">Грудь вместо матери, запах вместо девушки</p><div class="labels r step" style="margin-top:50px">' + lab('Младенец', 'Сначала знает не мать, а грудь. Целого человека, которого можно любить и потерять, открывает позже.', 'у Мелани Кляйн') + lab('Гренуй', 'Так и остаётся у груди. Ему нужна не девушка, а её запах.', 'в романе') + '</div></div>' },
  { label: 'II. Выживание', back: P + '10-back.webp', alt: 'Дом на мосту рушится в реку, Гренуй уходит прочь',
    figs: [{ src: P + '01-fig.webp', left: 7, top: 52, width: 6, d: .6 }],
    html: '<div class="cap top center" style="left:300px; right:300px"><p class="quote r">Другой становится настоящим, когда выживает</p></div>' +
      '<div class="cap center" style="left:260px; right:200px"><div class="labels r step">' + lab('Разрушаю', 'в фантазии, в ярости, в нападении') + lab('Выживает', 'не погибает и не мстит') + lab('Становится реальным', 'внешним, отдельным, другим') + '</div><p class="punch r step">В мире Гренуя не выживает никто.</p></div>' },
  { label: 'III. Язык, которого нет', back: P + '11-back.webp', alt: 'Двор с поленницей, маленький Гренуй нюхает щепку',
    figs: [{ src: P + '11-fig.webp', left: 40, top: 41, width: 17, d: .7 }],
    html: '<div class="cap top right" style="width:28%; right:300px"><div class="ghosts r" style="--d:1.2s"><span>совесть</span><span>Бог</span><span>радость</span></div></div>' +
      '<div class="cap left" style="width:34%; bottom:170px"><p class="punch r step">Опыт, для которого нет языка, некому воспринять.</p></div>' },
  { label: 'III. Второй крик', back: P + '12-back.webp', alt: 'Гора в разрезе, в тёплой полости спит свернувшийся человек',
    figs: [{ src: P + '12-fig.webp', left: 37, top: 46, width: 26, d: .5, sway: false }],
    html: '<div class="cap top center"><p class="quote r" style="--d:1.2s">Не «во мне ничего нет», а «меня никто не воспринял — и я не могу воспринять себя»</p></div>' },
  { label: 'IV. Шедевр', back: P + '13-back.webp', alt: 'Мастерская ночью: ряд пустых пузырьков и один светящийся флакон',
    html: '<div class="cap top center"><p class="big r step" style="font-size:84px">Двадцать пять девушек.</p><p class="big r step" style="font-size:84px">Двадцать пять убийств.</p><p class="big r step" style="font-size:84px">Один флакон.</p></div>' },
  { label: 'IV. Казнь', back: P + '14-back.webp', alt: 'Праздничная площадь в Грасе: на помосте Гренуй с платком, толпа в экстазе',
    figs: [{ src: P + '14-fig-g.webp', left: 33, top: 22, width: 9, d: .45 }, { src: P + '14-fig-crowd.webp', left: 10, top: 60, width: 80, d: .95, sway: false }],
    html: '<div class="cap top center"><p class="quote r" style="--d:1.6s">Та же сила, что движет любым художником, — но обращённая против субъекта</p></div>' },
  { label: 'IV. Наутро', back: P + '15-back.webp', alt: 'Пустая площадь на рассвете после праздника',
    html: '<div class="cap top center"><p class="quote r">А наутро — стыд, молчание и забвение</p></div>' +
      '<div class="cap center"><div class="labels r step">' + lab('Захват, а не опыт', 'чужой образ встаёт на место твоего идеала', 'Фрейд, 1921') + lab('Ложное творение', 'двадцать пять жизней — один запах', 'Шассге-Смиргель, 1984') + lab('Жадность без благодарности', 'вычерпанное — не дар, а оружие', 'Кляйн, 1957') + '</div></div>' },
  { label: 'V. Назад, в утробу', back: P + '12-back.webp', alt: 'Гора-утроба, внутри свернулся человек',
    figs: [{ src: P + '12-fig.webp', left: 40, top: 49, width: 20, d: .5, sway: false }],
    html: '<div class="cap top center"><p class="quote r" style="--d:1.2s">Его вобрали. Но вобрали только запах.</p></div>' +

  { label: 'VI. Так творчество ли это?', back: P + '14-back.webp', dim: true,
    html: '<div class="cap center" style="bottom:auto; top:250px"><p class="quote r">Творчество ли это?</p><div class="labels r step" style="margin-top:50px">' + lab('Творчество к жизни', 'оставляет другому свободу ответить и меняет обоих') + lab('Творчество к смерти', 'отменяет и другого, и самого автора') + '</div></div>' },
  { label: 'Эпилог', back: P + '16-back.webp', alt: 'Вечерний кабинет аналитика, между креслами дымка',
    html: '<div class="cap top center"><p class="quote r">Кажется, что переноса нет</p><div class="chips r" style="--d:1.3s; justify-content:center"><span class="chip">сонливость</span><span class="chip">пустота</span><span class="chip">растерянность</span></div></div>' +
      '<div class="cap center"><div class="labels r step">' + lab('Розенфельд, 1952', 'Перенос не отсутствует — его трудно распознать.') + lab('Винникотт, «Страх распада»', 'Катастрофа уже случилась — но рядом не было никого, кто помог бы её пережить.') + '</div></div>' },
  { label: 'Финал', back: P + '17-back.webp', alt: 'Кладбище на рассвете, пепел костра и пустой флакон',

  { label: 'Спасибо', end: true,

];
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const stage = document.getElementById('stage');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// собираем слайды
SCENES.forEach((sc, i) => {
  const s = document.createElement('section');
  s.className = 'slide' + (sc.end ? ' end' : '');
  s.dataset.label = sc.label || '';
  let h = '';
  if (sc.back) {
    h += '<div class="pt"><div class="pt-stage">';
    h += '<img class="pl back' + (sc.dim ? ' dim' : '') + '" data-d="0" src="' + sc.back + '" alt="' + (sc.alt || '') + '">';
    (sc.figs || []).forEach((f, k) => {
      h += '<img class="pl fig ' + (f.cut ? 'cut ' : '') + (f.sway === false ? '' : 'sway') + '" data-d="' + (f.d ?? .6) + '" src="' + f.src + '" alt="" style="left:' + f.left + '%;top:' + f.top + '%;width:' + f.width + '%;--in:' + (0.4 + k * 0.35) + 's;--sd:' + (-k * 1.7) + 's">';
    });
    h += '</div></div>';
    h += '<div class="curtain l"></div><div class="curtain r"></div><div class="valance"></div><div class="boards"></div>';
  }
  h += sc.html || '';
  s.innerHTML = h;
  stage.appendChild(s);
});
const slides = [...stage.querySelectorAll('.slide')];

// задник вписывается в кадр целиком по ширине или высоте
function layoutStages() {
  slides.forEach(s => {
    const st = s.querySelector('.pt-stage'), img = s.querySelector('.pl.back');
    if (!st || !img) return;
    const ar = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 16 / 9;
    const W = 1920, H = 1080;
    let w, h; if (W / H > ar) { w = W; h = W / ar; } else { h = H; w = H * ar; }
    Object.assign(st.style, { width: w + 'px', height: h + 'px', left: (W - w) / 2 + 'px', top: (H - h) / 2 + 'px' });
  });
}
stage.querySelectorAll('img.back').forEach(img => img.addEventListener('load', layoutStages));
layoutStages();

function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'scale(' + k + ') translate(-50%, -50%)';
}
addEventListener('resize', fit); fit();

// камера въезжает в сцену: слои ближе к зрителю приближаются быстрее
let t0 = 0;
const ease = x => 1 - Math.pow(1 - x, 3);
function frame(now) {
  const s = slides[cur];
  if (s && !calm) {
    if (!t0) t0 = now;
    const p = ease(Math.min(1, (now - t0) / 16000));
    s.querySelectorAll('.pl').forEach(l => {
      const d = parseFloat(l.dataset.d || 0);
      l.style.scale = (1 + p * (0.05 + d * 0.3)).toFixed(4);
      l.style.translate = '0 ' + (p * d * 2.5).toFixed(3) + '%';
    });
  }
  requestAnimationFrame(frame);
}

let cur = 0, stepIdx = 0;
const steps = s => [...s.querySelectorAll('.step')];
function show(i, fromEnd) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, j) => {
    const a = j === i;
    s.classList.toggle('current', a);
    if (a) { s.classList.remove('on'); void s.offsetWidth; s.classList.add('on'); }
    else setTimeout(() => { if (!s.classList.contains('current')) { s.classList.remove('on'); s.querySelectorAll('.pl').forEach(l => { l.style.scale = ''; l.style.translate = ''; }); } }, 1200);
  });
  cur = i; t0 = 0;
  const st = steps(slides[i]);
  stepIdx = fromEnd ? st.length : 0;
  st.forEach((e, k) => e.classList.toggle('shown', k < stepIdx));
  document.getElementById('bar').style.width = ((i + 1) / slides.length * 100) + '%';
  history.replaceState(null, '', '#' + (i + 1));
}
function next() { const st = steps(slides[cur]); if (stepIdx < st.length) { st[stepIdx].classList.add('shown'); stepIdx++; } else show(cur + 1); }
function prev() { const st = steps(slides[cur]); if (stepIdx > 0) { stepIdx--; st[stepIdx].classList.remove('shown'); } else if (cur > 0) show(cur - 1, true); }
function fullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); }
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n', 'N'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') fullscreen();
  else if (k === 'Home' || k === '0') show(0);
  else if (k === 'End') show(slides.length - 1, true);
  else if (k === 'Escape' && !document.fullscreenElement) location.href = 'article.html';
  document.getElementById('hint').classList.add('hide');
});
addEventListener('click', e => { if (e.target.closest('a, button')) return; if (e.clientX < innerWidth * .25) prev(); else next(); document.getElementById('hint').classList.add('hide'); });
let pt; addEventListener('mousemove', () => { document.body.classList.add('pointer'); clearTimeout(pt); pt = setTimeout(() => document.body.classList.remove('pointer'), 1800); });
setTimeout(() => document.getElementById('hint').classList.add('hide'), 6000);
document.addEventListener('click', e => { if (e.target.id === 'restart') { e.stopPropagation(); show(0); } }, true);
try { const qr = qrcode(0, 'M'); qr.addData('https://konyaginaan.github.io/tvorchestvo-k-smerti/'); qr.make(); const q = document.getElementById('qr'); if (q) q.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); } catch (e) {}

const start = parseInt(location.hash.slice(1), 10);
show(isNaN(start) ? 0 : start - 1);
requestAnimationFrame(frame);
</script>
